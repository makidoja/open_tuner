name: Modern UI Windows Build

on:
  push:
    branches:
      - modern-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore opentuner.sln

      - name: Build Release x64
        run: msbuild opentuner.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:RestorePackages=false

      - name: Upload Release build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTuner-modern-ui
          path: bin/Release/**
          if-no-files-found: error
