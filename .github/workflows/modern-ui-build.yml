name: Modern UI Windows Build

on:
  push:
    branches:
      - modern-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore opentuner.sln

      - name: Generate OpenTuner brand icon
        shell: pwsh
        run: |
          & '.\build\GenerateBrandIcon.ps1' -OutputPath '.\OpenTunerModern.ico'
          if (-not (Test-Path '.\OpenTunerModern.ico')) { throw 'OpenTunerModern.ico was not generated.' }
          if ((Get-Item '.\OpenTunerModern.ico').Length -lt 500) { throw 'Generated OpenTuner icon is unexpectedly small.' }

      - name: Build Release x64
        run: msbuild opentuner.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:OutputType=WinExe /p:RestorePackages=false

      - name: Add official OpenTuner FFmpeg runtime
        shell: pwsh
        run: |
          $releaseUrl = 'https://github.com/tomvdb/open_tuner/releases/download/V0.B/open_tuner_0.B_20240714.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'opentuner-official.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'opentuner-official'

          # This is a ~190 MB release asset. GitHub/CDN connections can occasionally
          # reset mid-transfer, so use curl's retry support instead of a single
          # Invoke-WebRequest attempt.
          & curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --output $zipPath $releaseUrl
          if ($LASTEXITCODE -ne 0) { throw "Failed to download official OpenTuner runtime after retries (curl exit $LASTEXITCODE)." }
          if (-not (Test-Path $zipPath)) { throw 'Official OpenTuner runtime download did not create a ZIP file.' }
          if ((Get-Item $zipPath).Length -lt 100MB) { throw 'Official OpenTuner runtime download is unexpectedly small/incomplete.' }

          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $ffmpegDir = Get-ChildItem -Path $extractPath -Directory -Recurse | Where-Object { $_.Name -ieq 'ffmpeg' } | Select-Object -First 1
          if (-not $ffmpegDir) { throw 'Official OpenTuner package did not contain an ffmpeg directory.' }
          Copy-Item -Path $ffmpegDir.FullName -Destination 'bin/Release/ffmpeg' -Recurse -Force
          Write-Host "Packaged FFmpeg runtime from $($ffmpegDir.FullName)"

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          if (-not (Test-Path 'bin/Release/opentuner.exe')) { throw 'opentuner.exe missing from Release output.' }
          if (-not (Test-Path 'bin/Release/ffmpeg')) { throw 'ffmpeg runtime folder missing from Release output.' }
          $dlls = Get-ChildItem 'bin/Release/ffmpeg' -Filter '*.dll' -Recurse
          if ($dlls.Count -lt 3) { throw 'ffmpeg runtime appears incomplete.' }
          Write-Host "FFmpeg runtime contains $($dlls.Count) DLLs"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }

          New-Item -ItemType Directory -Path 'installer-output' -Force | Out-Null
          & $iscc 'installer\OpenTuner.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE." }

          $installer = Get-ChildItem 'installer-output' -Filter 'OpenTuner-*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'OpenTuner installer EXE was not produced.' }
          Write-Host "Installer created: $($installer.FullName)"
          Write-Host "Installer size: $([math]::Round($installer.Length / 1MB, 1)) MB"

      - name: Upload Release build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTuner-modern-ui
          path: bin/Release/**
          if-no-files-found: error

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTuner-Windows-Installer-v1.2.0
          path: installer-output/*.exe
          if-no-files-found: error
