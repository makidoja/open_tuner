name: Publish OpenTuner M0CKE v1.3.4

on:
  push:
    branches:
      - connect-state-test
    paths:
      - .github/workflows/publish-v1.3.4.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes and manual
        uses: actions/checkout@v4

      - name: Verify exact v1.3.4 Windows installer build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_run=43641574459
          expected_sha=e8f88e6af079967507d21184ed954d2f70193373
          actual_sha="$(gh api repos/${{ github.repository }}/actions/runs/$build_run --jq '.head_sha')"
          test "$actual_sha" = "$expected_sha" || { echo "Unexpected build commit"; exit 1; }
          for attempt in $(seq 1 120); do
            state="$(gh api repos/${{ github.repository }}/actions/runs/$build_run --jq '.status')"
            result="$(gh api repos/${{ github.repository }}/actions/runs/$build_run --jq '.conclusion')"
            if [ "$state" = "completed" ]; then
              test "$result" = "success" || { echo "Build failed: $result"; exit 1; }
              break
            fi
            test "$attempt" -lt 120 || { echo "Build validation timed out"; exit 1; }
            sleep 15
          done
          if gh release view OpenTuner1.3.4 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release tag already exists"; exit 1
          fi

      - name: Retrieve and verify installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          gh run download 43641574459 --repo "${{ github.repository }}" \
            --name OpenTuner-Windows-Installer-v1.3.4 --dir release-out
          test -s release-out/OpenTuner-M0CKE-1.3.4-Setup.exe
          test "$(stat -c%s release-out/OpenTuner-M0CKE-1.3.4-Setup.exe)" -gt 10000000
          cp docs/OpenTuner-User-Manual.html release-out/OpenTuner-User-Manual.html
          sha256sum release-out/OpenTuner-M0CKE-1.3.4-Setup.exe > release-out/SHA256SUMS.txt

      - name: Publish v1.3.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create OpenTuner1.3.4 \
            release-out/OpenTuner-M0CKE-1.3.4-Setup.exe \
            release-out/OpenTuner-User-Manual.html \
            release-out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target e8f88e6af079967507d21184ed954d2f70193373 \
            --title "OpenTuner M0CKE v1.3.4 — Four-Receiver QO-100 Quick Tune" \
            --notes-file RELEASE_NOTES_1.3.4.md \
            --latest
