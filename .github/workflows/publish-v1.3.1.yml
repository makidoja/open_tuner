name: Publish OpenTuner M0CKE v1.3.1

on:
  push:
    branches:
      - connect-state-test
    paths:
      - .github/workflows/publish-v1.3.1.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes and manual
        uses: actions/checkout@v4

      - name: Confirm tested build and release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/43408713597 --jq '.conclusion')" = "success"
          test "$(gh api repos/${{ github.repository }}/actions/runs/43408713597 --jq '.head_sha')" = "12ec54755b8550bb1a7fda595b3793dd2bea14c4"
          if gh release view OpenTuner1.3.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "OpenTuner1.3.1 already exists. No duplicate release."
            exit 1
          fi

      - name: Retrieve tested v1.3.1 Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          gh run download 43408713597 --repo "${{ github.repository }}" \
            --name "OpenTuner-Windows-Installer-v1.3.1" --dir release-out
          test -s release-out/OpenTuner-M0CKE-1.3.1-Setup.exe
          test "$(stat -c%s release-out/OpenTuner-M0CKE-1.3.1-Setup.exe)" -gt 10000000
          cp docs/OpenTuner-User-Manual.html release-out/OpenTuner-User-Manual.html
          sha256sum release-out/OpenTuner-M0CKE-1.3.1-Setup.exe | tee release-out/SHA256SUMS.txt

      - name: Publish release from the verified build commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create OpenTuner1.3.1 \
            release-out/OpenTuner-M0CKE-1.3.1-Setup.exe \
            release-out/OpenTuner-User-Manual.html \
            release-out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target 12ec54755b8550bb1a7fda595b3793dd2bea14c4 \
            --title "OpenTuner M0CKE v1.3.1" \
            --notes-file RELEASE_NOTES_1.3.1.md \
            --latest
