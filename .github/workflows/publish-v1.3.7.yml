name: Publish OpenTuner M0CKE v1.3.7

# Publishes the installer built from the same commit that adds this file
# (the version bump, release notes and this workflow are committed together).
on:
  push:
    branches:
      - connect-state-test
    paths:
      - .github/workflows/publish-v1.3.7.yml

permissions:
  contents: write
  actions: read

env:
  RELEASE_SHA: ${{ github.sha }}
  RELEASE_TAG: OpenTuner1.3.7
  INSTALLER: OpenTuner-M0CKE-1.3.7-Setup.exe
  ARTIFACT: OpenTuner-Windows-Installer-v1.3.7

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes and manual
        uses: actions/checkout@v4

      - name: Find and verify the v1.3.7 Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"; exit 1
          fi
          build_run=""
          for attempt in $(seq 1 40); do
            build_run="$(gh run list --repo "${{ github.repository }}" --workflow modern-ui-build.yml \
              --commit "$RELEASE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$build_run" ] && break
            sleep 15
          done
          test -n "$build_run" || { echo "No build found for $RELEASE_SHA"; exit 1; }
          echo "Build run: $build_run"
          for attempt in $(seq 1 120); do
            state="$(gh api repos/${{ github.repository }}/actions/runs/$build_run --jq '.status')"
            result="$(gh api repos/${{ github.repository }}/actions/runs/$build_run --jq '.conclusion')"
            if [ "$state" = "completed" ]; then
              test "$result" = "success" || { echo "Build failed: $result"; exit 1; }
              break
            fi
            test "$attempt" -lt 120 || { echo "Build validation timed out"; exit 1; }
            sleep 15
          done
          echo "BUILD_RUN=$build_run" >> "$GITHUB_ENV"

      - name: Retrieve and verify installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          gh run download "$BUILD_RUN" --repo "${{ github.repository }}" \
            --name "$ARTIFACT" --dir release-out
          test -s "release-out/$INSTALLER"
          test "$(stat -c%s "release-out/$INSTALLER")" -gt 10000000
          cp docs/OpenTuner-User-Manual.html release-out/OpenTuner-User-Manual.html
          (cd release-out && sha256sum "$INSTALLER" > SHA256SUMS.txt)

      - name: Publish v1.3.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release-out/$INSTALLER" \
            release-out/OpenTuner-User-Manual.html \
            release-out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "$RELEASE_SHA" \
            --title "OpenTuner M0CKE v1.3.7 — WinterHill Quick Tune Fix" \
            --notes-file RELEASE_NOTES_1.3.7.md \
            --latest
            # publish
